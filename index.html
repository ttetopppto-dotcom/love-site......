<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لأجمل بنوته في الدنيا 🤭♥</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}

body{
background:linear-gradient(180deg,#120012,#1b001b,#000);
color:white;text-align:center;
}

/* خلفية */
.bg-slider{
position:fixed;inset:0;
background:radial-gradient(circle at top,#ff4f9555,#000),
radial-gradient(circle at bottom,#ff008055,#000);
filter:blur(20px);z-index:-2;
}

/* باسورد */
#passwordScreen{
position:fixed;inset:0;background:black;
display:flex;justify-content:center;align-items:center;
z-index:1000;
}

.pass-box{
background:rgba(0,0,0,0.5);
backdrop-filter:blur(15px);
padding:30px;border-radius:25px;
width:90%;max-width:350px;
box-shadow:0 0 30px rgba(255,0,120,.4);
}

.pass-box h1{color:#ff4f95;margin-bottom:10px;}

.heart-icon{
font-size:60px;
color:#ff4f95;
margin-bottom:10px;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{transform:scale(1.1);}
}

input{
width:100%;padding:15px;
border:none;border-radius:15px;
margin-top:10px;text-align:center;
}

button{
background:#ff4f95;color:white;
border:none;padding:15px;
border-radius:15px;margin-top:15px;
cursor:pointer;
}

/* محتوى */
.container{display:none;padding:20px;}

.photo-card,
.counter-box,
.secret-message,
.love-popup,
.memory-box,
.love-question{
background:rgba(0,0,0,0.4);
backdrop-filter:blur(15px);
border-radius:20px;
padding:20px;
margin-top:20px;
}

/* الموسيقى */
audio{display:none;}

</style>

</head>

<body>

<div class="bg-slider"></div>

<!-- شاشة الباسورد -->
<div id="passwordScreen">
<div class="pass-box">

<div class="heart-icon">❤️</div>

<h1>ادخلي الباسورد 🤭♥</h1>

<input type="password" id="password">

<button onclick="checkPassword()">فتح المفاجأة ♥</button>

</div>
</div>

<!-- المحتوى -->
<div class="container" id="mainContent">

<audio id="bgMusic" autoplay loop>
<source src="2087371553_tk (16).mp3" type="audio/mpeg">
</audio>

<h1>لأجمل بنوته في الدنيا 🤭♥</h1>

<div id="typewriter"></div>

</div>

<script>

/* الباسورد */
function checkPassword(){
let pass=document.getElementById("password").value;

if(pass==="love"){
document.getElementById("passwordScreen").style.display="none";
document.getElementById("mainContent").style.display="block";
startTyping();
}else{
alert("الباسورد غلط 🥺");
}
}

/* الكتابة */
const text=`بحبك اوي ❤️ ونفسي نبقى مع بعض علطول 🫂`;
let i=0;

function startTyping(){
function typing(){
if(i<text.length){
document.getElementById("typewriter").innerHTML+=text.charAt(i);
i++;
setTimeout(typing,50);
}
}
typing();
}

/* تشغيل الصوت */
document.addEventListener("click",function(){
let music=document.getElementById("bgMusic");
music.play();
},{once:true});

/* صوت تدريجي */
let music=document.getElementById("bgMusic");
music.volume=0;

let fade=setInterval(()=>{
if(music.volume<1){
music.volume+=0.05;
}else{
clearInterval(fade);
}
},300);

</script>

</body>
  </html>
